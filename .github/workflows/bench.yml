name: bench

# push to main and manual runs only, never pull requests: the external jobs run on the self-hosted
# homelab runners, and a PR must not be able to run code there
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      external:
        description: run the external tool comparison
        type: boolean
        default: true
      dotnet:
        description: run BenchmarkDotNet on the quiet windows runner
        type: boolean
        default: true
      filter:
        description: BenchmarkDotNet filter, e.g. *IndexBenchmarks*
        type: string
        default: '*'

permissions:
  contents: read

jobs:
  # AOT publish needs a linker toolchain, which only the hosted runners have
  publish:
    if: github.repository == 'codywilliamson/fetchle'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, rid: win-x64, exe: fetchle.exe }
          - { os: ubuntu-latest, rid: linux-x64, exe: fetchle }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: publish
        shell: bash
        run: dotnet build.cs publish --rid ${{ matrix.rid }}

      - uses: actions/upload-artifact@v7
        with:
          name: fetchle-${{ matrix.rid }}
          path: artifacts/publish/${{ matrix.exe }}
          if-no-files-found: error

  # both self-hosted runners are the same physical machine, so these two jobs are chained and share
  # a concurrency group (a second push waits its turn instead of racing the first). nothing here
  # AOT-publishes: the runners have no MSVC linker or clang
  bench-windows:
    needs: publish
    if: github.repository == 'codywilliamson/fetchle' && (github.event_name != 'workflow_dispatch' || inputs.external)
    runs-on: [self-hosted, Windows, homelab, fetchle]
    timeout-minutes: 120
    concurrency:
      group: homelab-bench
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      # the runner user can't write the system dotnet dir, so the sdk lives in the runner's tool cache
      - uses: actions/setup-dotnet@v6
        env:
          DOTNET_INSTALL_DIR: ${{ runner.tool_cache }}/dotnet
        with:
          global-json-file: global.json

      - uses: actions/download-artifact@v8
        with:
          name: fetchle-win-x64
          path: ${{ runner.temp }}/fetchle-exe

      - uses: ./.github/actions/bench-tools
        with:
          dir: ${{ runner.temp }}/bench-tools

      - name: bench external
        shell: cmd
        env:
          FETCHLE_EXE: ${{ runner.temp }}/fetchle-exe/fetchle.exe
          FETCHLE_BENCH_TOOLS: ${{ runner.temp }}/bench-tools
          FETCHLE_BENCH_CORPUS_DIR: ${{ runner.tool_cache }}/fetchle-bench-corpus
        run: dotnet build.cs bench-external

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: bench-external-windows
          path: bench/results/external-windows.json
          if-no-files-found: error

  bench-linux:
    needs: [publish, bench-windows]
    # run even when the windows job failed, but never at the same time as it
    if: ${{ !cancelled() && needs.publish.result == 'success' && github.repository == 'codywilliamson/fetchle' && (github.event_name != 'workflow_dispatch' || inputs.external) }}
    runs-on: [self-hosted, Linux, homelab, fetchle]
    timeout-minutes: 120
    concurrency:
      group: homelab-bench
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      # the runner user can't write the system dotnet dir, so the sdk lives in the runner's tool cache
      - uses: actions/setup-dotnet@v6
        env:
          DOTNET_INSTALL_DIR: ${{ runner.tool_cache }}/dotnet
        with:
          global-json-file: global.json

      - uses: actions/download-artifact@v8
        with:
          name: fetchle-linux-x64
          path: ${{ runner.temp }}/fetchle-exe

      - run: chmod +x "$RUNNER_TEMP/fetchle-exe/fetchle"

      - uses: ./.github/actions/bench-tools
        with:
          dir: ${{ runner.temp }}/bench-tools

      - name: bench external
        env:
          FETCHLE_EXE: ${{ runner.temp }}/fetchle-exe/fetchle
          FETCHLE_BENCH_TOOLS: ${{ runner.temp }}/bench-tools
          FETCHLE_BENCH_CORPUS_DIR: ${{ runner.tool_cache }}/fetchle-bench-corpus
        run: dotnet build.cs bench-external

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: bench-external-linux
          path: bench/results/external-linux.json
          if-no-files-found: error

  # JIT BenchmarkDotNet on the quiet windows box, after the external jobs so nothing overlaps.
  # hot-path commits quote these numbers before and after
  bench-dotnet:
    needs: [bench-windows, bench-linux]
    if: ${{ !cancelled() && github.repository == 'codywilliamson/fetchle' && (github.event_name != 'workflow_dispatch' || inputs.dotnet) }}
    runs-on: [self-hosted, Windows, homelab, fetchle]
    timeout-minutes: 120
    concurrency:
      group: homelab-bench
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      # the runner user can't write the system dotnet dir, so the sdk lives in the runner's tool cache
      - uses: actions/setup-dotnet@v6
        env:
          DOTNET_INSTALL_DIR: ${{ runner.tool_cache }}/dotnet
        with:
          global-json-file: global.json

      - name: benchmarkdotnet
        shell: cmd
        env:
          FETCHLE_BENCH_CORPUS_DIR: ${{ runner.tool_cache }}/fetchle-bench-corpus
          BENCH_FILTER: ${{ inputs.filter || '*' }}
        # unquoted so several space-separated patterns stay several filters; cmd doesn't glob
        run: dotnet run --project bench/Fetchle.Bench -c Release -- --filter %BENCH_FILTER%

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: bench-dotnet-windows
          path: bench/results/Fetchle.Bench.*.json
          if-no-files-found: error

  bench-dotnet-linux:
    needs: [bench-dotnet]
    if: ${{ !cancelled() && github.repository == 'codywilliamson/fetchle' && (github.event_name != 'workflow_dispatch' || inputs.dotnet) }}
    runs-on: [self-hosted, Linux, homelab, fetchle]
    timeout-minutes: 120
    concurrency:
      group: homelab-bench
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      # the runner user can't write the system dotnet dir, so the sdk lives in the runner's tool cache
      - uses: actions/setup-dotnet@v6
        env:
          DOTNET_INSTALL_DIR: ${{ runner.tool_cache }}/dotnet
        with:
          global-json-file: global.json

      - name: benchmarkdotnet
        env:
          BENCH_FILTER: ${{ inputs.filter || '*' }}
        # several space-separated patterns are several filters; -f keeps the shell from globbing them
        run: |
          set -f
          dotnet run --project bench/Fetchle.Bench -c Release -- --filter $BENCH_FILTER

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: bench-dotnet-linux
          path: bench/results/Fetchle.Bench.*.json
          if-no-files-found: error
